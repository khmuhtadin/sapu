# Developer tool caches. Source code, installed tools and project environments are never targeted.

- id: xcode.derived-data
  category: dev
  app: com.apple.dt.Xcode
  paths:
    - "~/Library/Developer/Xcode/DerivedData/**"
  risk: moderate
  regenerates: true
  explain:
    en: "Xcode build output and indexes, one folder per project. Safe to remove; Xcode rebuilds it, so the next build of each project is slower."
    zh: "Xcode 的构建产物和索引，每个项目一个文件夹。可以放心删除；Xcode 会重新生成，所以每个项目的下一次构建会变慢。"
    ja: "Xcodeのビルド成果物とインデックスです（プロジェクトごとに1フォルダ）。安全に削除できます。Xcodeが再作成するため、各プロジェクトの次回のビルドは遅くなります。"
    id: "Hasil build dan indeks Xcode, satu folder per proyek. Aman dihapus; Xcode akan membuatnya lagi, jadi build berikutnya untuk tiap proyek jadi lebih lambat."
    es: "Resultados de compilación e índices de Xcode, una carpeta por proyecto. Es seguro eliminarlos; Xcode los vuelve a crear, así que la próxima compilación de cada proyecto será más lenta."
    pt: "Resultados de build e índices do Xcode, uma pasta por projeto. Pode remover com segurança; o Xcode os recria, então o próximo build de cada projeto fica mais lento."
    de: "Build-Ausgaben und Indizes von Xcode, ein Ordner pro Projekt. Kann gefahrlos entfernt werden; Xcode erstellt sie neu, daher dauert der nächste Build jedes Projekts länger."
  protect_if:
    - process_running: Xcode
  action: quarantine
  fixture: xcode-derived-data

- id: xcode.device-support
  category: dev
  app: com.apple.dt.Xcode
  paths:
    - "~/Library/Developer/Xcode/iOS DeviceSupport/*"
    - "~/Library/Developer/Xcode/watchOS DeviceSupport/*"
    - "~/Library/Developer/Xcode/tvOS DeviceSupport/*"
  risk: moderate
  regenerates: true
  explain:
    en: "Debug symbols Xcode copied from iPhones, iPads, Watches and Apple TVs, one folder per OS version. Safe to remove; Xcode copies them again (a few minutes) the next time you connect a device on that version."
    zh: "Xcode 从 iPhone、iPad、Apple Watch 和 Apple TV 复制来的调试符号，每个系统版本一个文件夹。可以放心删除；下次连接该版本的设备时，Xcode 会再次复制（需要几分钟）。"
    ja: "XcodeがiPhone、iPad、Apple Watch、Apple TVからコピーしたデバッグシンボルです（OSバージョンごとに1フォルダ）。安全に削除できます。そのバージョンのデバイスを次に接続したとき、Xcodeが再度コピーします（数分かかります）。"
    id: "Simbol debug yang disalin Xcode dari iPhone, iPad, Apple Watch, dan Apple TV, satu folder per versi OS. Aman dihapus; Xcode akan menyalinnya lagi (beberapa menit) saat kamu menghubungkan perangkat dengan versi itu."
    es: "Símbolos de depuración que Xcode copió de iPhone, iPad, Apple Watch y Apple TV, una carpeta por versión del sistema. Es seguro eliminarlos; Xcode los copia de nuevo (unos minutos) la próxima vez que conectes un dispositivo con esa versión."
    pt: "Símbolos de depuração que o Xcode copiou de iPhones, iPads, Apple Watches e Apple TVs, uma pasta por versão do sistema. Pode remover com segurança; o Xcode os copia de novo (alguns minutos) na próxima vez que você conectar um dispositivo com essa versão."
    de: "Debug-Symbole, die Xcode von iPhones, iPads, Apple Watches und Apple TVs kopiert hat, ein Ordner pro Systemversion. Kann gefahrlos entfernt werden; Xcode kopiert sie beim nächsten Anschließen eines Geräts mit dieser Version erneut (einige Minuten)."
  protect_if:
    - process_running: Xcode
  action: quarantine
  fixture: xcode-device-support

- id: xcode.simulator-caches
  category: dev
  app: com.apple.iphonesimulator
  paths:
    - "~/Library/Developer/CoreSimulator/Caches/**"
  risk: moderate
  regenerates: true
  explain:
    en: "Simulator system caches (dyld). Safe to remove; the Simulator rebuilds them at its next launch, which takes a few minutes. Your simulated devices and their app data are not touched."
    zh: "Simulator 的系统缓存（dyld）。可以放心删除；Simulator 会在下次启动时重新生成，需要几分钟。你的模拟设备及其中的 App 数据不会被改动。"
    ja: "Simulatorのシステムキャッシュ（dyld）です。安全に削除できます。次回Simulatorを起動するときに再作成され、数分かかります。シミュレートしたデバイスとそのアプリのデータは変更されません。"
    id: "Cache sistem Simulator (dyld). Aman dihapus; Simulator akan membuatnya lagi saat dijalankan berikutnya, butuh beberapa menit. Perangkat simulasi dan data aplikasinya tidak disentuh."
    es: "Cachés del sistema de Simulator (dyld). Es seguro eliminarlos; Simulator los recrea en su próximo inicio, lo que tarda unos minutos. Tus dispositivos simulados y los datos de sus apps no se tocan."
    pt: "Caches do sistema do Simulator (dyld). Pode remover com segurança; o Simulator os recria na próxima inicialização, o que leva alguns minutos. Seus dispositivos simulados e os dados dos apps deles não são tocados."
    de: "System-Caches des Simulators (dyld). Kann gefahrlos entfernt werden; Simulator erstellt sie beim nächsten Start neu, das dauert einige Minuten. Simulierte Geräte und deren App-Daten werden nicht angetastet."
  protect_if:
    - process_running: Simulator
  action: quarantine
  fixture: xcode-simulator-caches

- id: xcode.documentation-cache
  category: dev
  app: com.apple.dt.Xcode
  paths:
    - ~/Library/Developer/Xcode/DocumentationCache
  risk: moderate
  regenerates: true
  explain:
    en: "Apple documentation that Xcode downloaded for offline use. Safe to remove; Xcode downloads it again when you open the documentation."
    zh: "Xcode 下载的、供离线使用的 Apple 文档。可以放心删除；你再次打开文档时，Xcode 会重新下载。"
    ja: "Xcodeがオフライン用にダウンロードしたAppleのドキュメントです。安全に削除できます。ドキュメントを開くと、Xcodeが再度ダウンロードします。"
    id: "Dokumentasi Apple yang diunduh Xcode untuk dipakai offline. Aman dihapus; Xcode akan mengunduhnya lagi saat kamu membuka dokumentasi."
    es: "Documentación de Apple que Xcode descargó para usarla sin conexión. Es seguro eliminarla; Xcode la descarga de nuevo cuando abres la documentación."
    pt: "Documentação da Apple que o Xcode baixou para uso off-line. Pode remover com segurança; o Xcode a baixa de novo quando você abre a documentação."
    de: "Apple-Dokumentation, die Xcode für die Offline-Nutzung geladen hat. Kann gefahrlos entfernt werden; Xcode lädt sie erneut, sobald die Dokumentation geöffnet wird."
  protect_if:
    - process_running: Xcode
  action: quarantine
  fixture: xcode-documentation-cache

- id: xcode.cache
  category: dev
  app: com.apple.dt.Xcode
  paths:
    - ~/Library/Caches/com.apple.dt.Xcode
  risk: safe
  regenerates: true
  explain:
    en: "Xcode's own cache folder. Safe to remove; Xcode rebuilds it as you work."
    zh: "Xcode 自己的缓存文件夹。可以放心删除；你继续工作时，Xcode 会重新生成。"
    ja: "Xcode自身のキャッシュフォルダです。安全に削除できます。作業を続けるうちにXcodeが再作成します。"
    id: "Folder cache milik Xcode sendiri. Aman dihapus; Xcode akan membuatnya lagi saat kamu bekerja."
    es: "La carpeta de caché propia de Xcode. Es seguro eliminarla; Xcode la recrea mientras trabajas."
    pt: "A pasta de cache do próprio Xcode. Pode remover com segurança; o Xcode a recria enquanto você trabalha."
    de: "Der eigene Cache-Ordner von Xcode. Kann gefahrlos entfernt werden; Xcode erstellt ihn während der Arbeit neu."
  protect_if:
    - process_running: Xcode
  action: quarantine
  fixture: xcode-cache

- id: swiftpm.cache
  category: dev
  app: org.swift.swiftpm
  paths:
    - "~/Library/Caches/org.swift.swiftpm/**"
  risk: moderate
  regenerates: true
  explain:
    en: "Swift Package Manager's cloned repositories and manifest cache. Safe to remove; packages are downloaded again the next time a project resolves them."
    zh: "Swift Package Manager 克隆的仓库和清单缓存。可以放心删除；下次有项目解析这些包时会重新下载。"
    ja: "Swift Package Managerがクローンしたリポジトリとマニフェストのキャッシュです。安全に削除できます。次にプロジェクトがパッケージを解決するとき、再度ダウンロードされます。"
    id: "Repositori hasil clone dan cache manifest milik Swift Package Manager. Aman dihapus; paket akan diunduh lagi saat proyek berikutnya me-resolve paket tersebut."
    es: "Repositorios clonados y caché de manifiestos de Swift Package Manager. Es seguro eliminarlos; los paquetes se descargan de nuevo la próxima vez que un proyecto los resuelva."
    pt: "Repositórios clonados e cache de manifestos do Swift Package Manager. Pode remover com segurança; os pacotes são baixados de novo na próxima vez que um projeto os resolver."
    de: "Geklonte Repositories und Manifest-Cache des Swift Package Managers. Kann gefahrlos entfernt werden; Pakete werden erneut geladen, sobald ein Projekt sie das nächste Mal auflöst."
  protect_if:
    - process_running: Xcode
  action: quarantine
  fixture: swiftpm-cache

- id: npm.cache
  category: dev
  paths:
    - ~/.npm/_cacache
  risk: moderate
  regenerates: true
  explain:
    en: "npm's download cache. Safe to remove; npm downloads packages again on the next install, so that install is slower."
    zh: "npm 的下载缓存。可以放心删除；下次安装时 npm 会重新下载软件包，所以那次安装会更慢。"
    ja: "npmのダウンロードキャッシュです。安全に削除できます。次回のインストール時にnpmがパッケージを再ダウンロードするため、そのインストールは遅くなります。"
    id: "Cache unduhan npm. Aman dihapus; npm akan mengunduh paket lagi saat install berikutnya, jadi install itu jadi lebih lambat."
    es: "La caché de descargas de npm. Es seguro eliminarla; npm vuelve a descargar los paquetes en la próxima instalación, así que esa instalación será más lenta."
    pt: "O cache de downloads do npm. Pode remover com segurança; o npm baixa os pacotes de novo na próxima instalação, então essa instalação fica mais lenta."
    de: "Der Download-Cache von npm. Kann gefahrlos entfernt werden; npm lädt Pakete bei der nächsten Installation erneut, daher dauert diese Installation länger."
  action: quarantine
  fixture: npm-cache

- id: yarn.cache
  category: dev
  paths:
    - "~/Library/Caches/Yarn/*"
    - ~/.yarn/berry/cache
  risk: moderate
  regenerates: true
  explain:
    en: "Yarn's package download cache. Safe to remove; Yarn downloads packages again on the next install, so that install is slower."
    zh: "Yarn 的软件包下载缓存。可以放心删除；下次安装时 Yarn 会重新下载软件包，所以那次安装会更慢。"
    ja: "Yarnのパッケージダウンロードキャッシュです。安全に削除できます。次回のインストール時にYarnがパッケージを再ダウンロードするため、そのインストールは遅くなります。"
    id: "Cache unduhan paket Yarn. Aman dihapus; Yarn akan mengunduh paket lagi saat install berikutnya, jadi install itu jadi lebih lambat."
    es: "La caché de descargas de paquetes de Yarn. Es seguro eliminarla; Yarn vuelve a descargar los paquetes en la próxima instalación, así que esa instalación será más lenta."
    pt: "O cache de downloads de pacotes do Yarn. Pode remover com segurança; o Yarn baixa os pacotes de novo na próxima instalação, então essa instalação fica mais lenta."
    de: "Der Paket-Download-Cache von Yarn. Kann gefahrlos entfernt werden; Yarn lädt Pakete bei der nächsten Installation erneut, daher dauert diese Installation länger."
  action: quarantine
