- id: pip.cache
  category: dev
  paths:
    - ~/Library/Caches/pip
  risk: moderate
  regenerates: true
  explain:
    en: "pip's download and wheel cache. Best cleared with pip's own command; pip downloads packages again the next time you install them."
    zh: "pip 的下载和 wheel 缓存。最好用 pip 自带的命令清理；下次安装软件包时，pip 会重新下载。"
    ja: "pipのダウンロードキャッシュとwheelキャッシュです。pip自身のコマンドで消去するのが最適です。次にパッケージをインストールするとき、pipが再ダウンロードします。"
    id: "Cache unduhan dan wheel milik pip. Sebaiknya dibersihkan dengan perintah bawaan pip; pip akan mengunduh paket lagi saat kamu menginstalnya berikutnya."
    es: "La caché de descargas y wheels de pip. Lo mejor es limpiarla con el comando propio de pip; pip vuelve a descargar los paquetes la próxima vez que los instales."
    pt: "O cache de downloads e wheels do pip. O ideal é limpar com o comando do próprio pip; o pip baixa os pacotes de novo na próxima vez que você os instalar."
    de: "Download- und Wheel-Cache von pip. Am besten mit dem eigenen Befehl von pip leeren; pip lädt Pakete bei der nächsten Installation erneut."
  action: official_command
  command:
    - "python3"
    - "-m"
    - "pip"
    - "cache"
    - "purge"
  fixture: pip-cache

- id: homebrew.downloads
  category: dev
  app: com.github.brew
  paths:
    - ~/Library/Caches/Homebrew/downloads
  risk: moderate
  regenerates: true
  explain:
    en: "Downloaded Homebrew bottles and sources. Best cleared with `brew cleanup`, which also removes old versions of installed formulae; Homebrew downloads again whatever you reinstall."
    zh: "已下载的 Homebrew bottle 和源码。最好用 `brew cleanup` 清理，它还会删除已安装 formula 的旧版本；重新安装时，Homebrew 会重新下载所需内容。"
    ja: "ダウンロード済みのHomebrewのbottleとソースです。`brew cleanup`で消去するのが最適です。インストール済みformulaの古いバージョンも削除されます。再インストールしたものは、Homebrewが再度ダウンロードします。"
    id: "Bottle dan source Homebrew yang sudah diunduh. Sebaiknya dibersihkan dengan `brew cleanup`, yang juga menghapus versi lama formula yang terpasang; Homebrew akan mengunduh lagi apa pun yang kamu instal ulang."
    es: "Bottles y fuentes de Homebrew descargados. Lo mejor es limpiarlos con `brew cleanup`, que también elimina las versiones antiguas de las fórmulas instaladas; Homebrew vuelve a descargar lo que reinstales."
    pt: "Bottles e fontes do Homebrew baixados. O ideal é limpar com `brew cleanup`, que também remove versões antigas das fórmulas instaladas; o Homebrew baixa de novo o que você reinstalar."
    de: "Heruntergeladene Homebrew-Bottles und -Quellen. Am besten mit `brew cleanup` leeren; das entfernt auch alte Versionen installierter Formulae. Homebrew lädt alles erneut, was neu installiert wird."
  action: official_command
  command:
    - "brew"
    - "cleanup"
    - "--prune=all"
  fixture: homebrew-downloads

- id: go.build-cache
  category: dev
  paths:
    - ~/Library/Caches/go-build
  risk: moderate
  regenerates: true
  explain:
    en: "Go's compiled build cache. Best cleared with `go clean -cache`; the next build of each project is slower while it fills again."
    zh: "Go 的编译构建缓存。最好用 `go clean -cache` 清理；缓存重新填充期间，每个项目的下一次构建会更慢。"
    ja: "Goのコンパイル済みビルドキャッシュです。`go clean -cache`で消去するのが最適です。キャッシュが再び貯まるまで、各プロジェクトの次回のビルドは遅くなります。"
    id: "Cache build hasil kompilasi Go. Sebaiknya dibersihkan dengan `go clean -cache`; build berikutnya untuk tiap proyek lebih lambat selama cache terisi lagi."
    es: "La caché de compilación de Go. Lo mejor es limpiarla con `go clean -cache`; la próxima compilación de cada proyecto será más lenta mientras se vuelve a llenar."
    pt: "O cache de build compilado do Go. O ideal é limpar com `go clean -cache`; o próximo build de cada projeto fica mais lento enquanto o cache se enche de novo."
    de: "Der kompilierte Build-Cache von Go. Am besten mit `go clean -cache` leeren; der nächste Build jedes Projekts dauert länger, solange sich der Cache wieder füllt."
  action: official_command
  command:
    - "go"
    - "clean"
    - "-cache"
  fixture: go-build-cache

- id: go.module-cache
  category: dev
  paths:
    - ~/go/pkg/mod
  risk: moderate
  regenerates: true
  explain:
    en: "Downloaded Go modules. Must be cleared with `go clean -modcache`, because Go makes these files read-only; modules download again at the next build, so offline builds fail until then."
    zh: "已下载的 Go 模块。必须用 `go clean -modcache` 清理，因为 Go 会把这些文件设为只读；模块会在下次构建时重新下载，所以在那之前离线构建会失败。"
    ja: "ダウンロード済みのGoモジュールです。Goはこれらのファイルを読み取り専用にするため、必ず`go clean -modcache`で消去してください。モジュールは次回のビルドで再ダウンロードされるため、それまではオフラインでのビルドは失敗します。"
    id: "Modul Go yang sudah diunduh. Harus dibersihkan dengan `go clean -modcache`, karena Go membuat file-file ini hanya-baca; modul akan diunduh lagi pada build berikutnya, jadi build offline akan gagal sampai saat itu."
    es: "Módulos de Go descargados. Deben limpiarse con `go clean -modcache`, porque Go marca estos archivos como de solo lectura; los módulos se descargan de nuevo en la próxima compilación, así que las compilaciones sin conexión fallan hasta entonces."
    pt: "Módulos do Go baixados. Devem ser limpos com `go clean -modcache`, porque o Go deixa esses arquivos somente leitura; os módulos são baixados de novo no próximo build, então builds off-line falham até lá."
    de: "Heruntergeladene Go-Module. Müssen mit `go clean -modcache` geleert werden, da Go diese Dateien schreibgeschützt anlegt; Module werden beim nächsten Build erneut geladen, daher schlagen Offline-Builds bis dahin fehl."
  action: official_command
  command:
    - "go"
    - "clean"
    - "-modcache"
  fixture: go-module-cache

- id: gradle.caches
  category: dev
  paths:
    - "~/.gradle/caches/*"
  risk: moderate
  regenerates: true
  explain:
    en: "Gradle's downloaded libraries and build caches. Safe to remove when no build is running; Gradle downloads and rebuilds them, so the next build is slower."
    zh: "Gradle 下载的库和构建缓存。没有构建在运行时可以放心删除；Gradle 会重新下载并重新生成，所以下一次构建会变慢。"
    ja: "Gradleがダウンロードしたライブラリとビルドキャッシュです。ビルドが実行中でなければ、安全に削除できます。Gradleが再ダウンロードして再作成するため、次回のビルドは遅くなります。"
    id: "Library yang diunduh dan cache build Gradle. Aman dihapus jika tidak ada build yang berjalan; Gradle akan mengunduh dan membuatnya lagi, jadi build berikutnya lebih lambat."
    es: "Bibliotecas descargadas y cachés de compilación de Gradle. Es seguro eliminarlas cuando no hay ninguna compilación en curso; Gradle las descarga y las reconstruye, así que la próxima compilación será más lenta."
    pt: "Bibliotecas baixadas e caches de build do Gradle. Pode remover com segurança quando nenhum build estiver em execução; o Gradle as baixa e as recria, então o próximo build fica mais lento."
    de: "Von Gradle geladene Bibliotheken und Build-Caches. Kann gefahrlos entfernt werden, wenn kein Build läuft; Gradle lädt und erstellt sie neu, daher dauert der nächste Build länger."
  protect_if:
    - process_running: java
  action: quarantine
  fixture: gradle-caches

- id: cargo.registry-cache
  category: dev
  paths:
    - "~/.cargo/registry/cache/*"
    - "~/.cargo/registry/src/*"
  risk: moderate
  regenerates: true
  explain:
    en: "Rust crates that Cargo downloaded and unpacked. Safe to remove; Cargo downloads them again at the next build that needs them."
    zh: "Cargo 下载并解压的 Rust crate。可以放心删除；下次有构建需要它们时，Cargo 会重新下载。"
    ja: "Cargoがダウンロードして展開したRustのcrateです。安全に削除できます。それらを必要とする次回のビルドで、Cargoが再ダウンロードします。"
    id: "Crate Rust yang diunduh dan diekstrak Cargo. Aman dihapus; Cargo akan mengunduhnya lagi pada build berikutnya yang membutuhkannya."
    es: "Crates de Rust que Cargo descargó y descomprimió. Es seguro eliminarlos; Cargo los vuelve a descargar en la próxima compilación que los necesite."
    pt: "Crates do Rust que o Cargo baixou e descompactou. Pode remover com segurança; o Cargo os baixa de novo no próximo build que precisar deles."
    de: "Rust-Crates, die Cargo geladen und entpackt hat. Kann gefahrlos entfernt werden; Cargo lädt sie beim nächsten Build, der sie braucht, erneut."
  protect_if:
    - process_running: cargo
    - process_running: rustc
  action: quarantine
  fixture: cargo-registry-cache

- id: cocoapods.cache
  category: dev
  paths:
    - ~/Library/Caches/CocoaPods
  risk: moderate
  regenerates: true
  explain:
    en: "CocoaPods' downloaded pod sources. Best cleared with `pod cache clean --all`; pods download again the next time you run `pod install`."
    zh: "CocoaPods 下载的 pod 源码。最好用 `pod cache clean --all` 清理；下次运行 `pod install` 时会重新下载 pod。"
    ja: "CocoaPodsがダウンロードしたpodのソースです。`pod cache clean --all`で消去するのが最適です。次に`pod install`を実行するとき、podは再ダウンロードされます。"
    id: "Source pod yang diunduh CocoaPods. Sebaiknya dibersihkan dengan `pod cache clean --all`; pod akan diunduh lagi saat kamu menjalankan `pod install` berikutnya."
    es: "Código fuente de pods que CocoaPods descargó. Lo mejor es limpiarlo con `pod cache clean --all`; los pods se descargan de nuevo la próxima vez que ejecutes `pod install`."
    pt: "Fontes de pods baixadas pelo CocoaPods. O ideal é limpar com `pod cache clean --all`; os pods são baixados de novo na próxima vez que você executar `pod install`."
    de: "Von CocoaPods geladene Pod-Quellen. Am besten mit `pod cache clean --all` leeren; Pods werden beim nächsten Ausführen von `pod install` erneut geladen."
  action: official_command
  command:
    - "pod"
    - "cache"
    - "clean"
    - "--all"
  fixture: cocoapods-cache

- id: bun.cache
  category: dev
  paths:
    - "~/.bun/install/cache/*"
  risk: moderate
  regenerates: true
  explain:
    en: "Bun's package download cache. Safe to remove; Bun downloads packages again on the next install."
