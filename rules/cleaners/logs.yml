- id: logs.vscode
  category: logs
  app: com.microsoft.VSCode
  paths:
    - "~/Library/Application Support/Code/logs/*"
  risk: safe
  regenerates: true
  explain:
    en: "VS Code's log folders, one per session. Safe to remove while VS Code is closed; VS Code creates a new one every time it starts."
    zh: "VS Code 的日志文件夹，每个会话一个。VS Code 关闭时可以放心删除；VS Code 每次启动都会创建新的日志文件夹。"
    ja: "VS Codeのログフォルダです（セッションごとに1つ）。VS Codeを終了しているときは、安全に削除できます。VS Codeは起動するたびに新しいログフォルダを作成します。"
    id: "Folder log VS Code, satu per sesi. Aman dihapus saat VS Code tertutup; VS Code membuat yang baru setiap kali dibuka."
    es: "Carpetas de registro de VS Code, una por sesión. Es seguro eliminarlas mientras VS Code está cerrado; VS Code crea una nueva cada vez que se inicia."
    pt: "Pastas de log do VS Code, uma por sessão. Pode remover com segurança enquanto o VS Code estiver fechado; o VS Code cria uma nova toda vez que é iniciado."
    de: "Protokollordner von VS Code, einer pro Sitzung. Kann gefahrlos entfernt werden, solange VS Code geschlossen ist; VS Code legt bei jedem Start einen neuen an."
  protect_if:
    - process_running: Code
    - process_running: Electron
  action: quarantine
  fixture: logs-vscode
