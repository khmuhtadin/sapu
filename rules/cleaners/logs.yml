# Log files and crash reports.

- id: logs.diagnostic-reports
  category: logs
  paths:
    - "~/Library/Logs/DiagnosticReports/**"
    - "~/Library/Logs/CrashReporter/**"
  risk: safe
  regenerates: false
  explain:
    en: "Crash and hang reports macOS saved when an app stopped working. Safe to remove unless you still want to send one to a developer; new reports appear only if something crashes again."
    zh: "macOS 在 App 停止工作时保存的崩溃和卡死报告。可以放心删除，除非你还想把某份报告发给开发者；只有再次发生崩溃时才会产生新报告。"
    ja: "Appが動作しなくなったときにmacOSが保存したクラッシュレポートとハングレポートです。開発者に送りたいレポートがなければ、安全に削除できます。新しいレポートは、再び何かがクラッシュした場合にのみ作成されます。"
    id: "Laporan crash dan hang yang disimpan macOS saat aplikasi berhenti bekerja. Aman dihapus, kecuali kamu masih ingin mengirimnya ke developer; laporan baru hanya muncul jika ada yang crash lagi."
    es: "Informes de fallos y bloqueos que macOS guardó cuando una app dejó de funcionar. Es seguro eliminarlos, salvo que aún quieras enviar alguno a un desarrollador; solo aparecen informes nuevos si algo vuelve a fallar."
    pt: "Relatórios de falhas e travamentos que o macOS salvou quando um app parou de funcionar. Pode remover com segurança, a menos que você ainda queira enviar algum a um desenvolvedor; novos relatórios só aparecem se algo falhar de novo."
    de: "Absturz- und Hängerberichte, die macOS gespeichert hat, wenn eine App nicht mehr funktionierte. Kann gefahrlos entfernt werden, außer ein Bericht soll noch an einen Entwickler geschickt werden; neue Berichte entstehen nur, wenn wieder etwas abstürzt."
  action: quarantine
  fixture: logs-diagnostic-reports

- id: logs.homebrew
  category: logs
  paths:
    - "~/Library/Logs/Homebrew/**"
  risk: safe
  regenerates: true
  explain:
    en: "Build and install logs from Homebrew, one folder per formula. Safe to remove; Homebrew writes new logs the next time it installs something."
    zh: "Homebrew 的构建和安装日志，每个 formula 一个文件夹。可以放心删除；Homebrew 下次安装东西时会写入新的日志。"
    ja: "Homebrewのビルドログとインストールログです（formulaごとに1フォルダ）。安全に削除できます。次にHomebrewが何かをインストールするとき、新しいログが書き込まれます。"
    id: "Log build dan instalasi dari Homebrew, satu folder per formula. Aman dihapus; Homebrew akan menulis log baru saat menginstal sesuatu berikutnya."
    es: "Registros de compilación e instalación de Homebrew, una carpeta por fórmula. Es seguro eliminarlos; Homebrew escribe registros nuevos la próxima vez que instala algo."
    pt: "Logs de build e instalação do Homebrew, uma pasta por fórmula. Pode remover com segurança; o Homebrew grava novos logs na próxima vez que instalar algo."
    de: "Build- und Installationsprotokolle von Homebrew, ein Ordner pro Formula. Kann gefahrlos entfernt werden; Homebrew schreibt neue Protokolle, sobald es das nächste Mal etwas installiert."
  action: quarantine
  fixture: logs-homebrew

- id: logs.coresimulator
  category: logs
  paths:
    - "~/Library/Logs/CoreSimulator/**"
  risk: safe
  regenerates: true
  explain:
    en: "Log files from the iOS Simulator. Safe to remove; the Simulator writes new logs the next time it runs."
    zh: "iOS Simulator 的日志文件。可以放心删除；Simulator 下次运行时会写入新的日志。"
    ja: "iOS Simulatorのログファイルです。安全に削除できます。次にSimulatorを実行するとき、新しいログが書き込まれます。"
    id: "File log dari iOS Simulator. Aman dihapus; Simulator akan menulis log baru saat dijalankan berikutnya."
    es: "Archivos de registro del iOS Simulator. Es seguro eliminarlos; Simulator escribe registros nuevos la próxima vez que se ejecuta."
    pt: "Arquivos de log do iOS Simulator. Pode remover com segurança; o Simulator grava novos logs na próxima vez que for executado."
    de: "Protokolldateien des iOS Simulators. Kann gefahrlos entfernt werden; Simulator schreibt neue Protokolle, sobald er das nächste Mal läuft."
  protect_if:
    - process_running: Simulator
  action: quarantine
  fixture: logs-coresimulator

