- id: logs.npm
  category: logs
  paths:
    - "~/.npm/_logs/**"
  risk: safe
  regenerates: true
  explain:
    en: "npm's debug logs, one file per command. Safe to remove; npm writes a new one each time it runs."
    zh: "npm 的调试日志，每条命令一个文件。可以放心删除；npm 每次运行时都会写入新的日志。"
    ja: "npmのデバッグログです（コマンドごとに1ファイル）。安全に削除できます。npmは実行するたびに新しいログを書き込みます。"
    id: "Log debug npm, satu file per perintah. Aman dihapus; npm menulis log baru setiap kali dijalankan."
    es: "Registros de depuración de npm, un archivo por comando. Es seguro eliminarlos; npm escribe uno nuevo cada vez que se ejecuta."
    pt: "Logs de depuração do npm, um arquivo por comando. Pode remover com segurança; o npm grava um novo toda vez que é executado."
    de: "Debug-Protokolle von npm, eine Datei pro Befehl. Kann gefahrlos entfernt werden; npm schreibt bei jedem Lauf ein neues."
  action: quarantine
  fixture: logs-npm

- id: logs.pip
