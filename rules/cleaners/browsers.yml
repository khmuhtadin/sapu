# Browser caches. Cache folders only: never profiles, history, cookies, passwords or extensions.

- id: chrome.cache
  category: browsers
  app: com.google.Chrome
  paths:
    - "~/Library/Caches/Google/Chrome/*/Cache"
    - "~/Library/Application Support/Google/Chrome/*/Code Cache"
    - "~/Library/Application Support/Google/Chrome/*/GPUCache"
    - ~/Library/Application Support/Google/Chrome/ShaderCache
    - ~/Library/Application Support/Google/Chrome/GrShaderCache
  risk: safe
  regenerates: true
  explain:
    en: "Chrome's page, script and graphics caches. Safe to remove; pages load a little slower the first time, then the cache fills again. Bookmarks, history, passwords, cookies and extensions are stored elsewhere and are not touched."
    zh: "Chrome 的网页、脚本和图形缓存。可以放心删除；页面第一次加载会稍慢一点，之后缓存会重新填充。书签、历史记录、密码、Cookie和扩展程序保存在其他位置，不会被改动。"
    ja: "Chromeのページ、スクリプト、グラフィックのキャッシュです。安全に削除できます。最初はページの読み込みが少し遅くなりますが、その後キャッシュはまた貯まります。ブックマーク、履歴、パスワード、Cookie、拡張機能は別の場所に保存されており、変更されません。"
    id: "Cache halaman, skrip, dan grafis Chrome. Aman dihapus; halaman dimuat sedikit lebih lambat pada awalnya, lalu cache terisi lagi. Bookmark, riwayat, kata sandi, cookie, dan ekstensi disimpan di tempat lain dan tidak disentuh."
    es: "Cachés de páginas, scripts y gráficos de Chrome. Es seguro eliminarlos; las páginas cargan un poco más lento la primera vez y después la caché se vuelve a llenar. Los marcadores, el historial, las contraseñas, las cookies y las extensiones están guardados en otro lugar y no se tocan."
    pt: "Caches de páginas, scripts e gráficos do Chrome. Pode remover com segurança; as páginas carregam um pouco mais devagar na primeira vez e depois o cache se enche de novo. Favoritos, histórico, senhas, cookies e extensões ficam armazenados em outro lugar e não são tocados."
    de: "Caches für Seiten, Skripte und Grafiken von Chrome. Kann gefahrlos entfernt werden; Seiten laden beim ersten Mal etwas langsamer, danach füllt sich der Cache wieder. Lesezeichen, Verlauf, Passwörter, Cookies und Erweiterungen sind an anderer Stelle gespeichert und werden nicht angetastet."
  protect_if:
    - process_running: Google Chrome
  action: quarantine
  fixture: chrome-cache

