  risk: safe
  regenerates: true
  explain:
    en: "Firefox's page cache and startup cache. Safe to remove; pages load a little slower the first time, then the cache fills again. Bookmarks, history, passwords, cookies and extensions are in your profile and are not touched."
    zh: "Firefox 的网页缓存和启动缓存。可以放心删除；页面第一次加载会稍慢一点，之后缓存会重新填充。书签、历史记录、密码、Cookie和扩展程序保存在你的配置文件中，不会被改动。"
    ja: "Firefoxのページキャッシュと起動キャッシュです。安全に削除できます。最初はページの読み込みが少し遅くなりますが、その後キャッシュはまた貯まります。ブックマーク、履歴、パスワード、Cookie、拡張機能はプロファイルの中に保存されており、変更されません。"
    id: "Cache halaman dan cache startup Firefox. Aman dihapus; halaman dimuat sedikit lebih lambat pada awalnya, lalu cache terisi lagi. Bookmark, riwayat, kata sandi, cookie, dan ekstensi ada di profil kamu dan tidak disentuh."
    es: "La caché de páginas y la de inicio de Firefox. Es seguro eliminarlos; las páginas cargan un poco más lento la primera vez y después la caché se vuelve a llenar. Los marcadores, el historial, las contraseñas, las cookies y las extensiones están en tu perfil y no se tocan."
    pt: "O cache de páginas e o cache de inicialização do Firefox. Pode remover com segurança; as páginas carregam um pouco mais devagar na primeira vez e depois o cache se enche de novo. Favoritos, histórico, senhas, cookies e extensões ficam no seu perfil e não são tocados."
    de: "Seiten-Cache und Start-Cache von Firefox. Kann gefahrlos entfernt werden; Seiten laden beim ersten Mal etwas langsamer, danach füllt sich der Cache wieder. Lesezeichen, Verlauf, Passwörter, Cookies und Erweiterungen liegen im Profil und werden nicht angetastet."
