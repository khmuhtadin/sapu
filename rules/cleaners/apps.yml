# App caches. Accounts, settings and user data are never targeted.

- id: slack.cache
  category: apps
  app: com.tinyspeck.slackmacgap
  paths:
    - ~/Library/Application Support/Slack/Cache
    - ~/Library/Application Support/Slack/Code Cache
    - ~/Library/Application Support/Slack/GPUCache
    - ~/Library/Application Support/Slack/Service Worker/CacheStorage
  risk: safe
  regenerates: true
  explain:
    en: "Slack's web content, script and graphics caches. Safe to remove; Slack reloads them at the next start and may open a little slower once. Your messages live on Slack's servers."
    zh: "Slack 的网页内容、脚本和图形缓存。可以放心删除；Slack 下次启动时会重新加载，第一次打开可能会稍慢一点。你的消息保存在 Slack 的服务器上。"
    ja: "Slackのウェブコンテンツ、スクリプト、グラフィックのキャッシュです。安全に削除できます。次回の起動時にSlackが読み込み直すため、一度だけ起動が少し遅くなることがあります。メッセージはSlackのサーバーに保存されています。"
    id: "Cache konten web, skrip, dan grafis Slack. Aman dihapus; Slack akan memuatnya ulang saat dibuka berikutnya, jadi mungkin sedikit lebih lambat terbuka sekali saja. Pesan kamu tersimpan di server Slack."
    es: "Cachés de contenido web, scripts y gráficos de Slack. Es seguro eliminarlos; Slack los vuelve a cargar en el próximo inicio y puede abrirse un poco más lento una sola vez. Tus mensajes están en los servidores de Slack."
    pt: "Caches de conteúdo web, scripts e gráficos do Slack. Pode remover com segurança; o Slack os carrega de novo na próxima vez que for iniciado e pode abrir um pouco mais devagar uma única vez. Suas mensagens ficam nos servidores do Slack."
    de: "Caches für Webinhalte, Skripte und Grafiken von Slack. Kann gefahrlos entfernt werden; Slack lädt sie beim nächsten Start neu und öffnet sich dabei einmalig etwas langsamer. Nachrichten liegen auf den Servern von Slack."
  protect_if:
    - process_running: Slack
  action: quarantine
  fixture: slack-cache

