    es: "Entornos virtuales de Python. Se vuelven a generar creando el entorno e instalando de nuevo los requisitos, lo que necesita una descarga."
    pt: "Ambientes virtuais do Python. Recriados ao criar o ambiente e instalar os requisitos de novo, o que exige um download."
    de: "Virtuelle Python-Umgebungen. Werden neu erstellt, indem die Umgebung angelegt und die Anforderungen erneut installiert werden, was einen Download braucht."

