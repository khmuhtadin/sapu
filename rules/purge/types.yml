    pt: "Bytecode do Python e caches de ferramentas. Criados de novo na próxima vez que o código ou as ferramentas forem executados."
    de: "Python-Bytecode und Werkzeug-Caches. Werden beim nächsten Ausführen des Codes oder der Werkzeuge neu erstellt."

