# Build-artifact types for `sapu purge`. Format: see internal/purge/types.go.
# List adapted from kondo (MIT, https://github.com/tbillington/kondo); see
# THIRD_PARTY_LICENSES. Left out on purpose, because they hold things that are
# not build output: Unreal Saved/ and Build/, Unity Build/ and Builds/, Swift
# .swiftpm/. Left out because an artifact must be one folder name: kondo's
# nested ones (android/build, project/target, linux/flutter/ephemeral, ...).
# Those are still found where the nested folder has its own marker, for
# example android/build through android/build.gradle.

- id: cargo
  markers: [Cargo.toml]
  artifacts: [target, .xwin-cache]
  risk: safe
  explain:
    en: "Rust build output. Rebuilt by the next cargo build."
    zh: "Rust 构建产物。下次 cargo build 时会重新生成。"
    ja: "Rustのビルド成果物です。次回のcargo buildで再作成されます。"
    id: "Hasil build Rust. Dibuat ulang oleh cargo build berikutnya."
    es: "Resultados de compilación de Rust. Se vuelven a generar con el próximo cargo build."
    pt: "Resultado de build do Rust. Recriado pelo próximo cargo build."
    de: "Rust-Build-Ausgaben. Werden vom nächsten cargo build neu erstellt."

- id: node
  markers: [package.json]
  artifacts: [node_modules, .next, .nuxt, .svelte-kit, .parcel-cache, .turbo, .angular]
  risk: safe
  explain:
    en: "Installed npm packages and build output. Rebuilt by npm install or the next build."
    zh: "已安装的 npm 软件包和构建产物。通过 npm install 或下次构建重新生成。"
    ja: "インストール済みのnpmパッケージとビルド成果物です。npm installまたは次回のビルドで再作成されます。"
    id: "Paket npm yang terpasang dan hasil build. Dibuat ulang oleh npm install atau build berikutnya."
    es: "Paquetes de npm instalados y resultados de compilación. Se vuelven a generar con npm install o con la próxima compilación."
    pt: "Pacotes npm instalados e resultado de build. Recriados por npm install ou pelo próximo build."
    de: "Installierte npm-Pakete und Build-Ausgaben. Werden von npm install oder vom nächsten Build neu erstellt."

- id: unity
  markers: [Assembly-CSharp.csproj]
  artifacts: [Library, Temp, Obj, Logs, MemoryCaptures]
  risk: moderate
  explain:
    en: "Unity import cache and temporary files. Unity rebuilds them when the project opens, which can take a while."
    zh: "Unity 的导入缓存和临时文件。项目打开时 Unity 会重新生成，这可能需要一段时间。"
    ja: "Unityのインポートキャッシュと一時ファイルです。プロジェクトを開くとUnityが再作成しますが、しばらく時間がかかることがあります。"
    id: "Cache impor dan file sementara Unity. Unity membuatnya lagi saat proyek dibuka, dan itu bisa butuh waktu cukup lama."
    es: "Caché de importación y archivos temporales de Unity. Unity los recrea al abrir el proyecto, lo que puede tardar un rato."
    pt: "Cache de importação e arquivos temporários do Unity. O Unity os recria quando o projeto é aberto, o que pode demorar um pouco."
    de: "Import-Cache und temporäre Dateien von Unity. Unity erstellt sie beim Öffnen des Projekts neu, was eine Weile dauern kann."

