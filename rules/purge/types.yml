    es: "Código compilado y caché de shaders de Unreal Engine. Se vuelven a generar al compilar o abrir el proyecto, lo que puede tardar mucho."
    pt: "Código compilado e cache de shaders do Unreal Engine. Recriados quando o projeto é compilado ou aberto, o que pode demorar muito."
    de: "Kompilierter Code und Shader-Cache von Unreal Engine. Werden beim Bauen oder Öffnen des Projekts neu erstellt, was lange dauern kann."

