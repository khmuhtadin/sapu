# Device backups
- id: iphone-backups
  paths:
    - ~/Library/Application Support/MobileSync
  reason:
    en: "iPhone and iPad backups; often the only copy"
    zh: "iPhone 和 iPad 的备份；通常是唯一的一份"
    ja: "iPhoneとiPadのバックアップです。多くの場合、これが唯一のコピーです"
    id: "Cadangan iPhone dan iPad; sering kali satu-satunya salinan"
    es: "Copias de seguridad de iPhone y iPad; a menudo son la única copia"
    pt: "Backups de iPhone e iPad; muitas vezes são a única cópia"
    de: "Backups von iPhone und iPad; oft die einzige Kopie"
  # sapu backups, where you pick one backup: one backup folder only, never
  # MobileSync, Backup or anything inside a backup.
  allow:
    - source: backups
      paths:
        - ~/Library/Application Support/MobileSync/Backup/*

