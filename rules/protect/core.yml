  reason:
    en: "Google Drive for desktop keeps files that are not uploaded yet in this cache; deleting it loses them"
    zh: "Google Drive 桌面版会把尚未上传的文件保存在这个缓存中；删除它会丢失这些文件"
    ja: "Google Drive for desktopは、まだアップロードされていないファイルをこのキャッシュに保存しています。削除すると失われます"
    id: "Google Drive for desktop menyimpan file yang belum diunggah di cache ini; menghapusnya berarti file-file itu hilang"
