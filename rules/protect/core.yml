# Cloud drives: the folder holds the only copy of anything not yet synced
- id: cloud-storage
  paths:
    - ~/Library/CloudStorage
    - ~/Dropbox
    - ~/Google Drive
    - ~/OneDrive*
  reason:
    en: "Cloud drive folders (Dropbox, Google Drive, OneDrive); removing files here deletes them online too"
    zh: "云盘文件夹（Dropbox、Google Drive、OneDrive）；在这里删除文件，网上的文件也会一并被删除"
    ja: "クラウドドライブのフォルダ（Dropbox、Google Drive、OneDrive）です。ここでファイルを削除すると、オンラインのファイルも削除されます"
