version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - exhaustive
    - gosec
    - forbidigo
  settings:
    errcheck:
      exclude-functions:
        # human output to stdout or stderr; a failed write is not worth an error check
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Remove|RemoveAll|Rename|Truncate)$
          msg: only internal/fsop may delete or move files
        - pattern: ^os\.UserHomeDir$
          msg: only internal/env may read the home folder
    gosec:
      excludes:
        - G204 # running commands with variable arguments is how official commands work
        - G304 # reading files from variable paths is what a disk tool does
  exclusions:
    rules:
      # st_dev is int32 on macOS; device numbers are only compared for equality
      - linters: [gosec]
        text: "G115: integer overflow conversion int32 -> uint64"
      # statfs block counts are far below 2^63
      - linters: [gosec]
        path: internal/(mcp/read|cli/summary)\.go
        text: "G115: integer overflow conversion uint64 -> int64"
      # restoring a parent folder that quarantine removed: macOS user folders are 0755
      - linters: [gosec]
        path: internal/fsop/fsop\.go
        text: "G301"
      - path: internal/fsop/
        linters: [forbidigo]
      - path: internal/env/
        linters: [forbidigo]
      - path: _test\.go
        linters: [forbidigo, gosec]
