name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6
      # nilaway finds possible nil dereferences. It is allowed to fail while we
      # see what it reports; make it blocking (remove continue-on-error) once
      # the output is clean. Pinned to a commit that needs only Go 1.25.
      - name: nilaway
        if: matrix.os == 'macos-15'
        continue-on-error: true
        run: go run go.uber.org/nilaway/cmd/nilaway@5d1c4273115113cfaa41fe873e4cc609aad534de ./...
